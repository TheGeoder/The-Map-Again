name: Build The Map

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - Android32
          - Android64

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Compile Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: ${{ matrix.target }}

      - name: Upload compiled package
        uses: actions/upload-artifact@v7
        with:
          name: TheMap-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
